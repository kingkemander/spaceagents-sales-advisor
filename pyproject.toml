[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceagents-sales-advisor"
version = "0.6.2"
description = "Local-first customer memory and follow-up runtime for Space Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SpaceAgents" }]
dependencies = ["Pillow==11.3.0", "rapidocr==3.9.2", "onnxruntime==1.19.2"]

[project.scripts]
sa-sales-advisor = "sa_sales_advisor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sa_sales_advisor*"]

[tool.setuptools.package-data]
sa_sales_advisor = ["templates/*.html"]
