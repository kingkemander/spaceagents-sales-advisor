<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SA 销售作战台</title>
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#697386;--line:#e7ebf2;--brand:#315ef6;--brand2:#6f8cff;--danger:#e34b4b;--warn:#e69b24;--good:#16a36a;--shadow:0 14px 40px rgba(32,48,85,.08)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#e9efff 0,transparent 30%),var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button{font:inherit}.shell{max-width:1440px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:22px}.eyebrow{color:var(--brand);font-weight:800;letter-spacing:.12em}.top h1{font-size:30px;line-height:1.2;margin:5px 0 7px}.sub{color:var(--muted)}.datebox{background:linear-gradient(135deg,#244de4,#6f8cff);color:#fff;border-radius:20px;padding:18px 22px;min-width:210px;box-shadow:0 16px 36px rgba(49,94,246,.22)}.datebox small{opacity:.8}.datebox strong{display:block;font-size:22px;margin-top:4px}
    .stats{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:12px;margin-bottom:18px}.stat{border:1px solid var(--line);background:rgba(255,255,255,.88);border-radius:16px;padding:15px 17px;box-shadow:var(--shadow)}.stat span{color:var(--muted)}.stat b{font-size:27px;display:block}.stat[data-kind=overdue] b{color:var(--danger)}.stat[data-kind=must] b{color:var(--brand)}.stat[data-kind=risk] b{color:var(--warn)}
    .toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin:16px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:999px;cursor:pointer}.filter.active{background:var(--ink);border-color:var(--ink);color:#fff}.search{width:min(320px,100%);border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:12px;outline:none}.search:focus{border-color:var(--brand)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.list{display:grid;gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.card.done{opacity:.55}.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.identity{display:flex;gap:11px}.avatar{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#dfe7ff,#f3f6ff);color:var(--brand);display:grid;place-items:center;font-size:17px;font-weight:800}.name{font-size:17px;font-weight:800}.meta{color:var(--muted);font-size:12px;margin-top:2px}.badge{white-space:nowrap;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#f1f3f7;color:var(--muted)}.badge.overdue{background:#ffeded;color:var(--danger)}.badge.must{background:#edf2ff;color:var(--brand)}.badge.suggested{background:#eaf8f2;color:var(--good)}.badge.risk{background:#fff4df;color:#ad6b00}
    .reason{margin:15px 0 10px;padding:11px 13px;border-radius:12px;background:#f6f8fc}.reason b{color:var(--brand)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cell{border-top:1px solid var(--line);padding-top:10px}.label{color:var(--muted);font-size:12px;margin-bottom:3px}.reply{background:#182238;color:#eaf0ff;border-radius:14px;padding:13px;margin-top:12px;white-space:pre-wrap}.actions{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:12px}.btn{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:10px;cursor:pointer}.btn:hover{border-color:var(--brand);color:var(--brand)}.donebtn{color:var(--good)}
    .side{display:grid;gap:14px;align-content:start}.sidepanel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.sidepanel h2{font-size:15px;margin:0 0 12px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{border-radius:9px;padding:7px 2px;color:var(--muted)}.day.today{background:var(--brand);color:#fff}.day i{display:block;font-style:normal;font-size:10px}.rule{display:flex;gap:9px;margin:11px 0;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:7px;flex:0 0 auto}.progress{height:8px;border-radius:99px;background:#edf0f5;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0}.empty{background:#fff;border:1px dashed #ccd4e2;border-radius:18px;padding:55px;text-align:center;color:var(--muted)}.footer{color:var(--muted);font-size:12px;text-align:center;margin:22px}
    @media(max-width:920px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{grid-row:1}.top{flex-direction:column}.datebox{width:100%}}@media(max-width:560px){.shell{padding:16px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.search{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">SALES ADVISOR</div><h1>今日销售作战台</h1><div class="sub">聚焦今天最需要推进的客户与下一步行动。</div></div>
      <div class="datebox"><small>行动日期</small><strong id="today"></strong><span id="weekday"></span></div>
    </header>
    <section class="stats" id="stats"></section>
    <div class="toolbar"><div class="filters" id="filters"></div><input id="search" class="search" placeholder="搜索客户、阶段或下一步…"></div>
    <div class="layout">
      <section class="list" id="cards"></section>
      <aside class="side">
        <section class="sidepanel"><h2>本周节奏</h2><div class="week" id="week"></div></section>
        <section class="sidepanel"><h2>今日完成度</h2><div class="progress"><i id="progress"></i></div><p class="sub" id="progressText"></p></section>
        <section class="sidepanel"><h2>跟进原则</h2><div class="rule"><i class="dot"></i><span>先处理承诺逾期和今天到期</span></div><div class="rule"><i class="dot"></i><span>先确认客户现状，再推进关键动作</span></div><div class="rule"><i class="dot"></i><span>沟通前核对价格、时间与正式承诺</span></div></section>
      </aside>
    </div>
    <div class="footer">今日行动清单 · 请根据实际沟通结果及时更新</div>
  </main>
  <script>
    const DATA=__DASHBOARD_DATA_JSON__;
    const labels={all:'全部',overdue:'已逾期',must:'今天必跟',suggested:'建议跟进',risk:'风险关注',waiting:'暂缓'};
    const intentLabels={high:'高意向',medium:'中意向',low:'低意向',unknown:'意向待确认'};
    let active='all',query='';
    const key=`sa-dashboard:${DATA.date}`;
    const done=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const day=new Date(`${DATA.date}T12:00:00`);document.querySelector('#today').textContent=day.toLocaleDateString('zh-CN',{month:'long',day:'numeric'});document.querySelector('#weekday').textContent=day.toLocaleDateString('zh-CN',{weekday:'long'});
    function counts(){return Object.fromEntries(Object.keys(labels).slice(1).map(k=>[k,DATA.customers.filter(x=>x.bucket===k).length]))}
    function renderStats(){const c=counts();document.querySelector('#stats').innerHTML=['must','suggested','overdue','risk','waiting'].map(k=>`<div class="stat" data-kind="${k}"><span>${labels[k]}</span><b>${c[k]}</b></div>`).join('')}
    function renderFilters(){document.querySelector('#filters').innerHTML=Object.entries(labels).map(([k,v])=>`<button class="filter ${active===k?'active':''}" data-filter="${k}">${v}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{active=b.dataset.filter;render()})}
    function renderWeek(){const monday=new Date(day);const n=(day.getDay()+6)%7;monday.setDate(day.getDate()-n);document.querySelector('#week').innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return `<div class="day ${d.toDateString()===day.toDateString()?'today':''}">${['一','二','三','四','五','六','日'][i]}<i>${d.getDate()}</i></div>`}).join('')}
    function visible(){return DATA.customers.filter(x=>(active==='all'||x.bucket===active)&&[x.name,x.stage,x.latest_update,x.next_action].join(' ').toLowerCase().includes(query))}
    function formatDate(v){if(!v)return'未排期';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
    function renderCards(){const rows=visible();const el=document.querySelector('#cards');if(!rows.length){el.innerHTML='<div class="empty">当前筛选下没有客户任务。</div>';return}el.innerHTML=rows.map(x=>`<article class="card ${done.has(x.customer_id)?'done':''}"><div class="cardhead"><div class="identity"><div class="avatar">${esc((x.name||'?').slice(0,1))}</div><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.stage||'阶段待确认')} · ${esc(intentLabels[x.intent_level]||x.intent_level||'意向待确认')}</div></div></div><span class="badge ${x.bucket}">${labels[x.bucket]}</span></div><div class="reason"><b>为什么现在跟：</b>${esc(x.followup_reason||x.latest_update||'按既定节奏持续跟进')}</div><div class="grid"><div class="cell"><div class="label">最新情况</div>${esc(x.latest_update||'暂无新的业务进展')}</div><div class="cell"><div class="label">下一步动作</div>${esc(x.next_action||'确认下一次沟通安排')}</div><div class="cell"><div class="label">下次跟进</div>${esc(formatDate(x.next_followup_at))}</div><div class="cell"><div class="label">风险</div>${esc((x.risks||[]).join('；')||'暂无明确风险')}</div></div>${x.reply_suggestion?`<div class="reply">${esc(x.reply_suggestion)}</div>`:''}<div class="actions"><span></span><div>${x.reply_suggestion?`<button class="btn" data-copy="${esc(x.customer_id)}">复制话术</button>`:''}<button class="btn donebtn" data-done="${esc(x.customer_id)}">${done.has(x.customer_id)?'撤销完成':'标记完成'}</button></div></div></article>`).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const x=DATA.customers.find(v=>v.customer_id===b.dataset.copy);navigator.clipboard.writeText(x.reply_suggestion);b.textContent='已复制';setTimeout(()=>b.textContent='复制话术',1200)});document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{done.has(b.dataset.done)?done.delete(b.dataset.done):done.add(b.dataset.done);localStorage.setItem(key,JSON.stringify([...done]));render()})}
    function renderProgress(){const actionable=DATA.customers.filter(x=>['overdue','must','suggested','risk'].includes(x.bucket));const n=actionable.filter(x=>done.has(x.customer_id)).length;const pct=actionable.length?Math.round(n/actionable.length*100):100;document.querySelector('#progress').style.width=`${pct}%`;document.querySelector('#progressText').textContent=`${n} / ${actionable.length} 位客户已处理（${pct}%）`}
    function render(){renderFilters();renderCards();renderProgress()}
    document.querySelector('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();renderCards()};renderStats();renderWeek();render();
  </script>
</body>
</html>
